version: 0.0
os: linux

files:
  - source: index.html
    destination: /var/www/html
permissions:
  - object: /var/www/html
    owner: apache
    group: apache
    mode: 755
    type:
      - directory
      - file
file_exists_behavior: OVERWRITE
hooks:
  AfterInstall:
    - location: /scripts/after_install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: /scripts/start_httpd.sh
      timeout: 60
      runas: root

